<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b5e"><title>Đăng nhập · Gia Phả Tổ Tiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#173b5e;--blue2:#285d83;--brown:#a8794f;--cream:#f5f1eb;--ink:#26384a;--muted:#718091;--line:#d9d0c4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#d8b58a44,transparent 30%),linear-gradient(140deg,#f5f1eb,#e8ded2);font-family:'Be Vietnam Pro',sans-serif;color:var(--ink)}.card{width:min(100%,460px);background:#fffdf9;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,6vw,42px);box-shadow:0 22px 70px #173b5e18}.brand{text-align:center;margin-bottom:28px}.seal{margin:0 auto 14px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#ead0b0;border:3px double #d8b58a;font-size:28px}.brand h1{font:700 28px 'Playfair Display',serif;color:var(--blue);margin:0 0 8px}.brand p{font-size:13px;color:var(--muted);margin:0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--brown);font-weight:700}.field{margin:17px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fffefa;font:inherit;outline:none}.field input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #285d8318}.btn{width:100%;border:0;border-radius:12px;background:var(--blue);color:white;padding:14px;font:700 14px inherit;cursor:pointer;margin-top:10px}.btn:hover{background:var(--blue2)}.btn:disabled{opacity:.6;cursor:wait}.status{padding:12px 14px;border-radius:10px;background:#e9f3e8;color:#315a38;font-size:13px;line-height:1.6;margin:14px 0}.status.error{background:#fae8e5;color:#8b3029}.links{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:13px;flex-wrap:wrap}.links a{color:var(--blue2);font-weight:700;text-decoration:none}.links a:hover{text-decoration:underline}.back{display:block;text-align:center;margin-top:24px;color:var(--muted);font-size:12px;text-decoration:none}.foot{text-align:center;font-size:11px;color:#8b8b83;margin-top:20px}
</style>
</head><body><main class="card"><header class="brand"><div class="seal">祖</div><div class="eyebrow">Gìn giữ cội nguồn</div><h1>Gia Phả Tổ Tiên</h1><p>Đăng nhập để kết nối cùng gia đình</p></header>
<div id="message" class="status" hidden></div>
<form id="loginForm"><div class="field"><label for="email">Địa chỉ email</label><input id="email" type="email" autocomplete="username" placeholder="email@example.com" required></div><div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required></div><button class="btn" id="submitBtn" type="submit">Đăng nhập</button></form>
<div class="links"><a href="./register.html">Tạo tài khoản mới</a><a href="./index.html">Về trang gia phả</a></div><a class="back" href="./index.html">← Quay lại trang chủ</a><div class="foot">Thông tin tài khoản được xác thực an toàn qua Supabase Auth.</div></main>
<script src="./config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.GIA_PHA_CONFIG||{};const sb=cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const msg=document.getElementById('message'),btn=document.getElementById('submitBtn');
function show(text,error=false){msg.textContent=text;msg.hidden=false;msg.classList.toggle('error',error)}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!sb){show('Chưa cấu hình kết nối Supabase.',true);return}btn.disabled=true;btn.textContent='Đang đăng nhập…';const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});btn.disabled=false;btn.textContent='Đăng nhập';if(error){show('Đăng nhập chưa thành công. Kiểm tra email, mật khẩu hoặc xác nhận email rồi thử lại.',true)}else{location.href='./index.html'}});
</script></body></html>
