<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b5e"><title>Đăng ký · Gia Phả Tổ Tiên</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#173b5e;--blue2:#285d83;--brown:#a8794f;--cream:#f5f1eb;--ink:#26384a;--muted:#718091;--line:#d9d0c4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 10%,#d8b58a44,transparent 30%),linear-gradient(140deg,#f5f1eb,#e8ded2);font-family:'Be Vietnam Pro',sans-serif;color:var(--ink)}.card{width:min(100%,480px);background:#fffdf9;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,6vw,42px);box-shadow:0 22px 70px #173b5e18}.brand{text-align:center;margin-bottom:24px}.seal{margin:0 auto 14px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#ead0b0;border:3px double #d8b58a;font-size:28px}.brand h1{font:700 28px 'Playfair Display',serif;color:var(--blue);margin:0 0 8px}.brand p{font-size:13px;color:var(--muted);margin:0}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--brown);font-weight:700}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fffefa;font:inherit;outline:none}.field input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #285d8318}.hint{font-size:11px;color:var(--muted);margin-top:6px}.btn{width:100%;border:0;border-radius:12px;background:var(--blue);color:white;padding:14px;font:700 14px inherit;cursor:pointer;margin-top:10px}.btn:hover{background:var(--blue2)}.btn:disabled{opacity:.6;cursor:wait}.status{padding:12px 14px;border-radius:10px;background:#e9f3e8;color:#315a38;font-size:13px;line-height:1.6;margin:14px 0}.status.error{background:#fae8e5;color:#8b3029}.links{text-align:center;margin-top:22px;font-size:13px}.links a{color:var(--blue2);font-weight:700;text-decoration:none}.links a:hover{text-decoration:underline}.foot{text-align:center;font-size:11px;color:#8b8b83;margin-top:20px}
</style></head><body><main class="card"><header class="brand"><div class="seal">祖</div><div class="eyebrow">Thành viên gia đình</div><h1>Tạo tài khoản</h1><p>Đăng ký để lưu tài khoản trên hệ thống</p></header>
<div id="message" class="status" hidden></div>
<form id="registerForm"><div class="field"><label for="name">Họ và tên</label><input id="name" type="text" autocomplete="name" maxlength="80" placeholder="Tên của bạn" required></div><div class="field"><label for="email">Địa chỉ email</label><input id="email" type="email" autocomplete="email" placeholder="email@example.com" required></div><div class="field"><label for="password">Tạo mật khẩu</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Ít nhất 8 ký tự" required><div class="hint">Dùng mật khẩu riêng, khó đoán và không chia sẻ cho người khác.</div></div><div class="field"><label for="confirm">Nhập lại mật khẩu</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Nhập lại mật khẩu" required></div><button class="btn" id="submitBtn" type="submit">Đăng ký tài khoản</button></form>
<div class="links">Đã có tài khoản? <a href="./login.html">Đăng nhập</a></div><div class="links"><a href="./index.html">← Về trang gia phả</a></div><div class="foot">Mật khẩu được Supabase Auth xử lý; website không lưu mật khẩu dạng văn bản.</div></main>
<form id="verifyForm" hidden><div class="field"><label for="otp">Mã xác nhận 6 số trong email</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="Nhập mã 6 số" required></div><button class="btn" id="verifyBtn" type="submit">Xác nhận email</button><button class="btn" id="resendBtn" type="button" style="background:#a8794f">Gửi lại mã xác nhận</button></form>
<script src="./config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.GIA_PHA_CONFIG||{};const sb=cfg.url&&cfg.anonKey?createClient(cfg.url,cfg.anonKey):null;
const msg=document.getElementById('message'),btn=document.getElementById('submitBtn');
const registerForm=document.getElementById('registerForm'),verifyForm=document.getElementById('verifyForm');
let pendingEmail='';
function show(text,error=false){msg.textContent=text;msg.hidden=false;msg.classList.toggle('error',error)}
registerForm.addEventListener('submit',async e=>{
 e.preventDefault();
 const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password!==confirm){show('Hai mật khẩu không khớp.',true);return}
 if(password.length<8){show('Mật khẩu cần ít nhất 8 ký tự.',true);return}
 if(!sb){show('Chưa cấu hình kết nối Supabase.',true);return}
 btn.disabled=true;btn.textContent='Đang tạo tài khoản…';
 const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});
 btn.disabled=false;btn.textContent='Đăng ký tài khoản';
 if(error){show(error.message||'Không thể đăng ký. Hãy kiểm tra email và thử lại.',true);return}
 pendingEmail=email;
 registerForm.hidden=true;verifyForm.hidden=false;
 show('Đã gửi mã xác nhận đến '+email+'. Hãy nhập mã 6 số trong email để kích hoạt tài khoản.');
});
verifyForm.addEventListener('submit',async e=>{
 e.preventDefault();if(!sb||!pendingEmail){show('Hãy đăng ký email trước khi xác nhận.',true);return}
 const verifyBtn=document.getElementById('verifyBtn'),token=document.getElementById('otp').value.trim();
 if(!/^\d{6}$/.test(token)){show('Mã xác nhận phải gồm 6 chữ số.',true);return}
 verifyBtn.disabled=true;verifyBtn.textContent='Đang xác nhận…';
 const {error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:'signup'});
 verifyBtn.disabled=false;verifyBtn.textContent='Xác nhận email';
 if(error){show('Mã không đúng hoặc đã hết hạn. Hãy kiểm tra email và thử lại.',true);return}
 show('Xác nhận email thành công! Đang chuyển đến trang gia phả…');
 setTimeout(()=>location.href='./index.html',1000);
});
document.getElementById('resendBtn').addEventListener('click',async()=>{
 if(!sb||!pendingEmail)return;
 const resend=document.getElementById('resendBtn');resend.disabled=true;resend.textContent='Đang gửi lại…';
 const {error}=await sb.auth.resend({type:'signup',email:pendingEmail});
 resend.disabled=false;resend.textContent='Gửi lại mã xác nhận';
 if(error)show('Chưa gửi lại được mã. Vui lòng đợi một chút rồi thử lại.',true);
 else show('Đã yêu cầu gửi lại mã xác nhận đến '+pendingEmail+'.');
});
</script></body></html>
